[workspace]
resolver = "3"
members = ["src/core", "src/store", "src/ui", "src/runtime", "src/bench", "src/link", "src/amml"]

[workspace.package]
version = "26.63.4"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
lru = "0.18.5"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wal-db = "1.0.0"
zstd = "0.14.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
crossbeam-channel = "0.5.17"
clipboard-win = "5.4.1"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
tempfile = "3.27.0"
minimap-core = { path = "src/core" }
minimap-store = { path = "src/store" }
minimap-runtime = { path = "src/runtime" }
minimap-ui = { path = "src/ui" }
minimap-link = { path = "src/link" }
hcl-rs = "=0.19.8"
curia = "=0.2.2"
amm-abi = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4" }
amm-client = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4" }
amm-core = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4" }
amm-ffi = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4" }
amml-ui = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-i18n = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-i18n-tool = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-ui-rules = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-sdk = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-game = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-msvc = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
windows-sys = "0.61.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
