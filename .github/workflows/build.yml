name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/minimap

defaults:
  run:
    working-directory: minimap

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: minimap

      - uses: jdx/mise-action@v2
        with:
          working_directory: minimap

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            minimap/target
          key: cargo-${{ hashFiles('minimap/Cargo.lock', 'minimap/rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test
      - run: mise run package

      - uses: actions/upload-artifact@v7
        with:
          name: alaydriem-minimap-${{ github.sha }}-windows-x64
          path: minimap/dist/@alaydriem/minimap/
