[tasks.preflight]
description = "Names a missing toolchain or tool before a build turns it into an obscure error"
dir = "{{config_root}}"
run = ["rustc --version", "cargo --version", "cargo nextest --version"]

[tasks.check]
description = "Compiles, runs clippy with warnings denied and checks formatting"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.test]
description = "Every test through cargo nextest run"
dir = "{{config_root}}"
run = "cargo nextest run --workspace"

# Translation catalog: minimap/ui/i18n holds minimap.pot (written from MinimapMessage), the translators' <locale>.po
# files, and packs/<locale>.json.

[tasks."i18n:extract"]
description = "Writes minimap/ui/i18n/minimap.pot from MinimapMessage"
dir = "{{config_root}}"
run = "cargo run -q -p minimap-ui --example minimap_i18n_extract"

[tasks."i18n:check"]
description = "Fails when minimap/ui/i18n/minimap.pot is out of date with MinimapMessage"
dir = "{{config_root}}"
run = "cargo run -q -p minimap-ui --example minimap_i18n_extract -- --check"

[tasks."i18n:pseudo"]
description = "Writes the en_XA pseudo-locale pack of minimap.pot into minimap/ui/i18n/packs/en_XA.json"
dir = "{{config_root}}"
shell = "bash -c"
run = [
  "bash scripts/amml-i18n-tool.sh pseudo minimap/ui/i18n/minimap.pot minimap/ui/i18n/packs/en_XA.json",
]

[tasks.package]
description = "Builds dist/@alaydriem/minimap/ (alaydriem_minimap.dll, amml.hcl, OFL.txt), the release artifact"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
cargo build --release -p minimap-amml
rm -rf dist/alaydriem-minimap dist/@alaydriem/minimap
mkdir -p dist/@alaydriem/minimap
cp target/release/alaydriem_minimap.dll dist/@alaydriem/minimap/alaydriem_minimap.dll
cp minimap/amml/amml.hcl dist/@alaydriem/minimap/amml.hcl
# the DLL embeds the NordwandMono font from amml-ui; its licence ships beside it
ui_manifest=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "amml-ui") | .manifest_path')
cp "$(dirname "$ui_manifest")/assets/fonts/OFL.txt" dist/@alaydriem/minimap/OFL.txt
echo "built dist/@alaydriem/minimap"
'''

[tasks.e2e]
description = "Runs minimap against the real mod manager host (minimap-amml's e2e target) and replays the synthetic walk and every capture in fixtures/"
dir = "{{config_root}}"
env = { LM_E2E_CAPTURES = "{{config_root}}/target/e2e" }
run = [
  "cargo run -q --release -p minimap-bench --bin capture-tool -- e2e {{config_root}}/fixtures {{config_root}}/target/e2e",
  "cargo nextest run -p minimap-amml --test e2e",
]

[tasks.bench]
description = "Criterion benches in minimap-bench against the synthetic terrain and fixtures/; arguments narrow the run"
dir = "{{config_root}}"
run = "cargo bench -p minimap-bench --bench minimap --"

[tasks.bench-report]
description = "Writes the saved Criterion results as target/bench/rust.csv (bench, variant, iterations, mean_ns, p50_ns, p99_ns)"
dir = "{{config_root}}"
run = "cargo run -q --release -p minimap-bench --bin bench-csv -- target/criterion target/bench/rust.csv"

[tasks.report-bench]
description = "Compares a saved earlier run, target/bench/before.csv, with target/bench/rust.csv as a Markdown table"
dir = "{{config_root}}"
run = "cargo run -q --release -p minimap-bench --bin report -- bench target/bench/before.csv target/bench/rust.csv"

[tasks.report-telemetry]
description = "Compares a saved earlier run, target/telemetry/before.csv, with target/telemetry/rust.csv (the telemetry route runbook)"
dir = "{{config_root}}"
run = "cargo run -q --release -p minimap-bench --bin report -- telemetry target/telemetry/before.csv target/telemetry/rust.csv"

[tasks.footprint]
description = "Prints chunk surface size, chunks per 64 MiB and region file bytes as name,value lines"
dir = "{{config_root}}"
run = "cargo run -q --release -p minimap-bench --bin footprint"

[tasks.capture]
description = "Prints the in-game procedure for recording a new probe capture. Runs nothing"
dir = "{{config_root}}"
run = "cargo run -q --release -p minimap-bench --bin capture-tool -- procedure"

[tools]
# cargo metadata is read with it, to find the amml sources cargo fetched
jq = "1.8.1"

[tasks.install]
description = "Runs package, then copies dist/@alaydriem/minimap into mods/amml/@alaydriem/minimap of an AMML instance under %LOCALAPPDATA%/amml/instances (--instance, default 1.26.60.05). The mod's config/ stays. Close the game first: a running game locks the DLL"
depends = ["package"]
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" default="1.26.60.05" help="The instance folder under %LOCALAPPDATA%/amml/instances"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the instances live under %LOCALAPPDATA%/amml/instances"; exit 1; }
instance="$LOCALAPPDATA/amml/instances/${usage_instance:-1.26.60.05}"
[ -f "$instance/Minecraft.Windows.exe" ] || { echo "no instance at $instance"; exit 1; }
target="$instance/mods/amml/@alaydriem/minimap"
mkdir -p "$target"
cp -r dist/@alaydriem/minimap/. "$target/"
echo "installed dist/@alaydriem/minimap -> $target"
'''
