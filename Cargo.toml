[workspace]
resolver = "3"
members = ["minimap/core", "minimap/store", "minimap/ui", "minimap/runtime", "minimap/bench", "minimap/link", "minimap/amml"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
lru = "0.18.5"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wal-db = "1.0.0"
zstd = "0.14.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
crossbeam-channel = "0.5.17"
clipboard-win = "5.4.1"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
tempfile = "3.27.0"
minimap-core = { path = "minimap/core" }
minimap-store = { path = "minimap/store" }
minimap-runtime = { path = "minimap/runtime" }
minimap-ui = { path = "minimap/ui" }
minimap-link = { path = "minimap/link" }
hcl-rs = "=0.19.8"
curia = "=0.2.2"
amm-abi = { path = "../modmanager-amml/crates/amm-abi" }
amm-client = { path = "../modmanager-amml/crates/amm-client" }
amm-core = { path = "../modmanager-amml/crates/amm-core" }
amm-ffi = { path = "../modmanager-amml/crates/amm-ffi" }
amml-ui = { path = "../amml/ui/kit" }
amml-i18n = { path = "../amml/i18n/runtime" }
amml-i18n-tool = { path = "../amml/i18n/tool" }
amml-ui-rules = { path = "../amml/ui/rules" }
amml-sdk = { path = "../amml/sdk/sdk" }
amml-game = { path = "../amml/sdk/game" }
amml-msvc = { path = "../amml/sdk/msvc" }
windows-sys = "0.61.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
